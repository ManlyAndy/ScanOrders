<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Загрузка маршрута</title>
<link rel="icon" href="icon-192.png">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: #111827; color: #f3f4f6; min-height: 100vh; padding: 20px;
  }
  h1 { font-size: 20px; }
  input, select { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 10px;
    border: 1px solid #374151; background: #1f2937; color: #f3f4f6; font-size: 15px; }
  button { width: 100%; padding: 14px; border-radius: 10px; border: none; font-size: 16px;
    font-weight: 600; cursor: pointer; margin-bottom: 10px; }
  .btn-primary { background: #2563eb; color: white; }
  .btn-success { background: #16a34a; color: white; }
  .error { color: #f87171; font-size: 14px; }
  .ok-msg { color: #86efac; font-size: 14px; }
  .card { background: #1f2937; border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .chip-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { background: #374151; padding: 6px 10px; border-radius: 999px; font-size: 13px; }
  .hint { font-size: 13px; color: #9ca3af; }
  label { font-size: 13px; color: #9ca3af; }
  select:disabled { opacity: 0.85; color: #f3f4f6; }
  button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>

<div id="screen-login">
  <h1>Вход</h1>
  <input id="login-user" type="text" placeholder="Логин (email) в МойСклад">
  <input id="login-pass" type="password" placeholder="Пароль">
  <button class="btn-primary" onclick="doLogin()">Войти</button>
  <div id="login-error" class="error"></div>
</div>

<div id="screen-main" style="display:none;">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;">
    <h1 style="margin-bottom:14px;">Загрузка маршрута</h1>
    <button class="link-btn" style="width:auto;background:none;color:#93c5fd;text-decoration:underline;padding:4px;margin-bottom:10px;" onclick="logout()">Выйти</button>
  </div>

  <label>Дата отгрузки (подставляется из названия файла)</label>
  <input id="route-date" type="text" inputmode="numeric" placeholder="например 28.08.2026" autocomplete="off">

  <label>Тип маршрута (определяется по названию файла: МСК или ТК)</label>
  <select id="route-label">
    <option value="МСК">МСК</option>
    <option value="ТК">ТК</option>
  </select>

  <label>PDF со списком отгрузок. В названии файла должны быть тип и дата, например: МСК_28.08.pdf</label>
  <input id="pdf-file" type="file" accept="application/pdf">

  <div id="parse-status" class="hint"></div>

  <div id="preview-card" class="card" style="display:none;">
    <b id="preview-count"></b>
    <div id="preview-chips" class="chip-list"></div>
  </div>

  <label style="display:flex;align-items:center;gap:8px;margin-bottom:12px;">
    <input id="replace-route" type="checkbox" style="width:auto;margin:0;">
    Заменить маршрут целиком (новые номера добавляются к уже загруженным)
  </label>

  <button class="btn-success" id="send-btn" style="display:none;" onclick="sendRoute()">Отправить маршрут</button>
  <div id="send-result"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="config.js"></script>
<script src="logist.js"></script>
</body>
</html>
