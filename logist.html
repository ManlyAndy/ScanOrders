<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Загрузка маршрута</title>
<link rel="icon" href="icon-192.png">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: #111827; color: #f3f4f6; min-height: 100vh; padding: 20px;
  }
  h1 { font-size: 20px; }
  input, select { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 10px;
    border: 1px solid #374151; background: #1f2937; color: #f3f4f6; font-size: 15px; }
  button { width: 100%; padding: 14px; border-radius: 10px; border: none; font-size: 16px;
    font-weight: 600; cursor: pointer; margin-bottom: 10px; }
  .btn-primary { background: #2563eb; color: white; }
  .btn-success { background: #16a34a; color: white; }
  .error { color: #f87171; font-size: 14px; }
  .ok-msg { color: #86efac; font-size: 14px; }
  .card { background: #1f2937; border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .chip-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { background: #374151; padding: 6px 10px; border-radius: 999px; font-size: 13px; }
  .hint { font-size: 13px; color: #9ca3af; }
  label { font-size: 13px; color: #9ca3af; }
</style>
</head>
<body>

<div id="screen-login">
  <h1>Вход</h1>
  <input id="login-user" type="text" placeholder="Логин (email) в МойСклад">
  <input id="login-pass" type="password" placeholder="Пароль">
  <button class="btn-primary" onclick="doLogin()">Войти</button>
  <div id="login-error" class="error"></div>
</div>

<div id="screen-main" style="display:none;">
  <h1>Загрузка маршрута</h1>

  <label>Дата отгрузки</label>
  <input id="route-date" type="date">

  <label>Тип маршрута</label>
  <select id="route-label">
    <option value="МСК">МСК</option>
    <option value="ТК">ТК</option>
     <option value="Найм">Найм</option>
  </select>

  <label>PDF со списком отгрузок (из печати в МойСклад)</label>
  <input id="pdf-file" type="file" accept="application/pdf">

  <div id="parse-status" class="hint"></div>

  <div id="preview-card" class="card" style="display:none;">
    <b id="preview-count"></b>
    <div id="preview-chips" class="chip-list"></div>
  </div>

  <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:12px;">
    <button class="btn-secondary" id="task-btn" style="display:none;" onclick="openTaskModal()">Доп. задание</button>
    <button class="btn-success" id="send-btn" style="display:none;" onclick="sendRoute()">Отправить маршрут</button>
    <button class="btn-secondary" id="print-btn" style="display:none;" onclick="printRoute()">Распечатать маршрут</button>
  </div>
  <div id="task-preview" class="hint" style="margin-top:10px;"></div>
  <div id="send-result"></div>

  <div id="task-modal" class="modal-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.65); align-items:center; justify-content:center; padding:16px; z-index:1000;">
    <div class="card" style="width:min(560px,100%); background:#111827;">
      <h3 style="margin-top:0;">Доп. задание</h3>
      <p class="hint">Можно оставить пустым. Каждое задание — с новой строки.</p>
      <textarea id="task-input" rows="8" style="width:100%; box-sizing:border-box; resize:vertical;" placeholder="Например:
Забрать документы у поставщика
Отвезти коробку на склад"></textarea>
      <div style="display:flex; gap:8px; margin-top:12px;">
        <button class="btn-success" onclick="saveTasks()">Сохранить</button>
        <button class="btn-secondary" onclick="closeTaskModal()">Отмена</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="config.js"></script>
<script src="logist.js"></script>
</body>
</html>
