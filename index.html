<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Контроль отгрузок</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.css" />
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f7fa;
    color: #222;
    min-height: 100vh;
  }
  .screen { display: none; padding: 16px; max-width: 560px; margin: 0 auto; }
  .screen.active { display: block; }
  h1 { font-size: 22px; margin: 8px 0 16px; text-align: center; }
  h2 { font-size: 18px; margin: 16px 0 10px; }
  .card {
    background: #fff;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
  }
  .card.ok { border-left: 5px solid #2ecc71; }
  .card.bad { border-left: 5px solid #e74c3c; }
  .badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 14px;
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 8px;
    color: #fff;
  }
  .badge.ok { background: #2ecc71; }
  .badge.bad { background: #e74c3c; }
  .num { font-size: 22px; font-weight: 700; margin: 6px 0; }
  .meta { font-size: 14px; color: #555; margin: 4px 0; }
  .hint { font-size: 13px; color: #777; text-align: center; margin: 10px 0; }
  .hint-small { font-size: 12px; color: #888; text-align: center; margin: 6px 0; }
  .error { color: #e74c3c; font-size: 14px; text-align: center; }
  input[type="text"], input[type="password"], input[type="date"], select {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    border: 1px solid #ddd;
    border-radius: 8px;
    margin-bottom: 10px;
    background: #fff;
  }
  button {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 8px;
  }
  .btn-primary { background: #007bff; color: #fff; }
  .btn-secondary { background: #e9ecef; color: #333; }
  .btn-danger { background: #e74c3c; color: #fff; }
  .btn-success { background: #2ecc71; color: #fff; }
  .spinner {
    width: 40px; height: 40px;
    border: 4px solid #eee;
    border-top-color: #007bff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 20px auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #reader { width: 100%; border-radius: 12px; overflow: hidden; }
  .scanner-wrap {
    max-width: 320px;
    margin: 0 auto 16px;
  }
  .route-selector {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 12px;
  }
  .type-btn {
    flex: 1;
    padding: 10px;
    border: 2px solid #ddd;
    background: #fff;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
  }
  .type-btn.active {
    background: #007bff;
    color: #fff;
    border-color: #007bff;
  }
  .route-info {
    background: #fff;
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    text-align: center;
  }
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .modal-overlay.active { display: flex; }
  .modal-content {
    background: #fff;
    border-radius: 12px;
    padding: 16px;
    max-width: 500px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
  }
  .modal-row {
    display: flex;
    justify-content: space-between;
    padding: 10px;
    border-bottom: 1px solid #eee;
  }
  .modal-row.scanned { opacity: 0.5; text-decoration: line-through; }
  .check { color: #2ecc71; font-weight: 700; }
</style>
</head>
<body>

<div id="screen-login" class="screen">
  <h1>Вход — Контроль отгрузок</h1>
  <div class="card">
    <p class="hint">Введите ваш логин и пароль от МойСклад.</p>
    <input type="text" id="login-user" placeholder="Логин (email)" autocomplete="username" />
    <input type="password" id="login-pass" placeholder="Пароль" autocomplete="current-password" />
    <div id="login-error" class="error"></div>
    <button class="btn-primary" onclick="doLogin()">Войти</button>
  </div>
</div>

<div id="screen-scan" class="screen">
  <div style="text-align:center;margin-bottom:8px;">
    <span id="who-label" style="font-size:13px;color:#666;"></span>
